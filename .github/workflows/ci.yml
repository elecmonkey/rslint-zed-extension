name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JavaScript and TypeScript
        run: pnpm check

      - name: Build launcher
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Check Zed extension
        run: cargo check --target wasm32-wasip2
